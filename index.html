<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenDev Sensor Logger</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- static site header: brand, log counter -->
    <header class="site-header">
        <h1>GreenDev</h1>
        <!-- javascript updates the log count -->
        <p>Active logs: <span id="log-count">0</span></p>
    </header>

    <main>
        <!-- left entry panel -->
        <section id="entry-panel">
            <h2>Record Sensor Reading</h2>

            <!-- makes error hidden until validation fails. role="alert" makes screen readers announce it -->
            <div id="form-error" class="alert hidden" role="alert"></div>

            <!-- novalidate makes the browser not block submit -->
            <form id="input-form" novalidate>

                <!-- bay: a <select> makes you only choose available options -->
                <label for="bay">Greenhouse Bay</label>
                <select id="bay" name="bay" required>
                    <option value="" disabled selected>Select a bay</option>
                    <option value="A">Bay A</option>
                    <option value="B">Bay B</option>
                    <option value="C">Bay C</option>
                    <option value="D">Bay D</option>
                </select>

                <label for="ph">pH (0-14)</label>
                <input
                type="number"
                id="ph"
                name="ph"
                min="0"
                max="14"
                step="0.1"
                placeholder="6.1"
                required
                />

                <label for="ec">EC (0-10 mS/cm)</label>
                <input
                type="number"
                id="ec"
                name="ec"
                min="0"
                max="10"
                step="0.01"
                placeholder="2.02"
                required
                />

                <label for="temp">Temp (32-122 °F)</label>
                <input
                type="number"
                id="temp"
                name="temp"
                min="32"
                max="122"
                step="0.1"
                placeholder="66.2"
                required
                />

                <label for="rh">RH (0-100 %)</label>
                <input
                type="number"
                id="rh"
                name="rh"
                min="0"
                max="100"
                step="0.1"
                placeholder="60"
                required
                />

                <button type="submit">Record Reading</button>
            </form>
        </section>

        <!-- log history on right -->
        <section id="log-history">
            <header>
                <h2>Data Log History</h2>
                <button id="purge-all" type="button">Purge All</button>
            </header>

            <p id="empty-state">No entries logged yet</p>

            <!-- aria-live="polite" announces new cards to screen readers -->
            <ul id="historical" aria-live="polite"></ul>

            <!-- li cards are made by render() in app.js-->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GreenDev CSI 3150</p>
    </footer>

    <!-- app.js at the end so the DOM exists before app.js runs -->
    <script src="app.js"></script>
</body>

</html>
